{% extends "base.html" %}
{% block title %}Server Error - TruthLens AI{% endblock %}

{% block content %}
<section class="page-section">
    <div class="container text-center">
        <div class="error-page" data-animate="fade-up">
            <h1 class="error-code">500</h1>
            <h3 class="mb-3">Something Went Wrong</h3>
            <p class="text-muted mb-4">An unexpected error occurred on our end. Please try again shortly.</p>
            <a href="{{ url_for('landing') }}" class="btn btn-gradient rounded-pill px-4">
                <i class="bi bi-house me-2"></i>Back to Home
            </a>
        </div>
    </div>
</section>
{% endblock %}
