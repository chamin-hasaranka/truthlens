{% extends "base.html" %}
{% block title %}Login - TruthLens AI{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-7" data-animate="fade-up">
                <div class="auth-card">
                    <div class="text-center mb-4">
                        <div class="auth-icon"><i class="bi bi-shield-lock"></i></div>
                        <h3 class="mt-3 mb-1">Welcome Back</h3>
                        <p class="text-muted">Sign in to continue to your dashboard</p>
                    </div>

                    <form method="POST" action="{{ url_for('login') }}" novalidate>
                        <div class="mb-3">
                            <label class="form-label">Email address</label>
                            <div class="input-group input-group-custom">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" name="email" placeholder="you@example.com"
                                       value="{{ email or '' }}" required autofocus>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <div class="input-group input-group-custom">
                                <span class="input-group-text"><i class="bi bi-key"></i></span>
                                <input type="password" class="form-control" name="password" id="loginPassword"
                                       placeholder="••••••••" required>
                                <span class="input-group-text toggle-password" data-target="loginPassword">
                                    <i class="bi bi-eye"></i>
                                </span>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-gradient w-100 rounded-pill py-2 mt-2">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <p class="text-muted mb-0">
                            Don't have an account?
                            <a href="{{ url_for('register') }}" class="link-gradient">Create one</a>
                        </p>
                    </div>

                    <div class="demo-hint mt-4">
                        <i class="bi bi-info-circle me-2"></i>
                        Admin demo login: <strong>admin@example.com</strong> / <strong>admin123</strong>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
