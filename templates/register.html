{% extends "base.html" %}
{% block title %}Create Account - TruthLens AI{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-7" data-animate="fade-up">
                <div class="auth-card">
                    <div class="text-center mb-4">
                        <div class="auth-icon"><i class="bi bi-person-plus"></i></div>
                        <h3 class="mt-3 mb-1">Create Your Account</h3>
                        <p class="text-muted">Join TruthLens AI and start detecting fake news</p>
                    </div>

                    <form method="POST" action="{{ url_for('register') }}" novalidate>
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <div class="input-group input-group-custom">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text" class="form-control" name="username" placeholder="johndoe"
                                       value="{{ username or '' }}" required minlength="3" autofocus>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email address</label>
                            <div class="input-group input-group-custom">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" name="email" placeholder="you@example.com"
                                       value="{{ email or '' }}" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <div class="input-group input-group-custom">
                                <span class="input-group-text"><i class="bi bi-key"></i></span>
                                <input type="password" class="form-control" name="password" id="regPassword"
                                       placeholder="At least 6 characters" required minlength="6">
                                <span class="input-group-text toggle-password" data-target="regPassword">
                                    <i class="bi bi-eye"></i>
                                </span>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Confirm Password</label>
                            <div class="input-group input-group-custom">
                                <span class="input-group-text"><i class="bi bi-key-fill"></i></span>
                                <input type="password" class="form-control" name="confirm_password" id="confirmPassword"
                                       placeholder="Re-enter your password" required minlength="6">
                                <span class="input-group-text toggle-password" data-target="confirmPassword">
                                    <i class="bi bi-eye"></i>
                                </span>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-gradient w-100 rounded-pill py-2 mt-2">
                            <i class="bi bi-person-check me-2"></i>Create Account
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <p class="text-muted mb-0">
                            Already have an account?
                            <a href="{{ url_for('login') }}" class="link-gradient">Sign in</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
